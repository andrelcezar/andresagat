<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-label="Gonzaga &amp; Oliveira - Odontologia Especializada e Prótese Dentária">
  <title>Gonzaga &amp; Oliveira</title>
  <defs>
    <linearGradient id="goldTooth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
  </defs>

  <!-- Tooth icon: rounded crown + two roots -->
  <path
    d="M120 55
       A 40 40 0 1 1 200 55
       L 190 78
       Q 186 100 180 121
       Q 172 103 160 93
       Q 148 103 140 121
       Q 134 100 130 78
       L 120 55 Z"
    fill="url(#goldTooth)"/>

  <!-- Wordmark -->
  <text x="160" y="152" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="27"
        letter-spacing="0.5" fill="#D4A017">GONZAGA &amp; OLIVEIRA</text>

  <line x1="30" y1="164" x2="290" y2="164" stroke="#D4A017" stroke-width="2" opacity="0.85"/>

  <text x="160" y="182" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12"
        letter-spacing="1.5" fill="#D4A017">ODONTOLOGIA ESPECIALIZADA</text>
</svg>
